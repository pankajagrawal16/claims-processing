site_name: ClaimSight Claims MicroHack
site_description: Hands-on guide to building a grounded, secure claims-processing workflow with Microsoft Foundry.
site_url: https://pankaagr.cloud/claims-processing/
docs_dir: docs
site_dir: site
use_directory_urls: false
hooks:
  - hooks/sync_docs.py
watch:
  - agent-framework
  - challenges
  - data
  - labautomation

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - glightbox
  - mermaid-zoom

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Get started: challenges/challenge-01.md
  - Challenges:
      - Challenge 2 - Claims Intake: challenges/challenge-02.md
      - Challenge 3 - Claims Intelligence: challenges/challenge-03.md
      - Challenge 4 - Agent Framework: challenges/challenge-04-agent-framework.md
      - Challenge 4 - Sequential alternative: challenges/challenge-04.md
      - Challenge 5 - Observability and evaluation: challenges/challenge-05.md
      - Challenge 6 - Security: challenges/challenge-06.md
  - Shell selection: shells.md
  - Contributing: contributing.md

exclude_docs: |
  /challenges/instruction-discrepancies.md
  /agent-framework/Dockerfile
  /uv.lock
  /walkthrough/

not_in_nav: |
  /agent-framework/README.md
  /labautomation/data/policies/*.md
  /data/policies/*.md
  /labautomation/README.md

extra_javascript:
  - https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js
